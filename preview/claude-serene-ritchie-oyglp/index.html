<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tankbuster – Phase 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Preview Banner (nur in Preview-Deployments sichtbar) -->
  <div id="preview-banner">
    &#9888; PREVIEW &#8211; Branch: <span id="branch-name"></span>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="tank-name">&#x1F42F; Königstiger</div>
    <div id="hp-bar-container">
      <div id="hp-bar"></div>
    </div>
    <div id="hp-text">&#x2764;&#xFE0F; HP: 100 / 100</div>
  </div>

  <!-- Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Touch-Joystick links -->
  <div id="joystick-left-base" class="joystick-base">
    <div id="joystick-left-knob" class="joystick-knob"></div>
  </div>

  <!-- Touch-Joystick rechts (Turm) -->
  <div id="joystick-right-base" class="joystick-base">
    <div id="joystick-right-knob" class="joystick-knob"></div>
  </div>

  <!-- Schiess-Button -->
  <button id="shoot-btn">&#x1F534; Kanone</button>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="version.js?v=1" onerror="void(0)"></script>
  <script src="game.js"></script>
</body>
</html>
